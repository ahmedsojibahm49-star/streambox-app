name: Build APK

# Builds a release APK on every push to main and on manual dispatch.
# The APK is uploaded as an artifact (streambox-apk) — download it from the
# Actions run, or from the release the verification agent wires up later.
#
# NOTE: this workflow does NOT run build_runner. Hive adapters (*.g.dart) are
# committed to the repo; if a workstream adds a model or a HiveField without
# regenerating (`dart run build_runner build --delete-conflicting-outputs`),
# the build step fails — regenerate and commit the adapters.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: streambox-apk
          path: build/app/outputs/flutter-apk/app-release.apk
