name: streambox
description: "StreamBox — anime, movies, manga & manhwa from your own JSON provider catalogs. Local-first, no server."
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0

  # State + routing
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local storage + crypto (all data is on-device)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  encrypt: ^5.0.3

  # Network + media
  http: ^1.6.0
  video_player: ^2.14.1
  youtube_player_flutter: ^10.0.2
  cached_network_image: ^4.0.7

  # Platform + files
  device_info_plus: ^13.3.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.4.0

  # i18n (hand-rolled maps in lib/i18n; intl only for date formatting)
  intl: ^0.20.3

  # Icons — official Iconsax (Linear base names, Bold `_copy` variants).
  # NOTE: the `iconsax` package (0.0.8, 2021) is Dart-2-only and cannot be
  # used; `iconsax_flutter` is the maintained Dart-3 fork. See CONTRACT.md.
  iconsax_flutter: ^1.0.1

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Hive codegen. build_runner is PINNED to 2.4.13 on purpose:
  # hive_generator 2.0.1 needs analyzer <7.0.0, while build_runner >=2.4.14
  # pulls analyzer ^6.5+ which needs the `_macros` SDK package that Dart
  # 3.14 no longer ships (pub resolution fails). Do NOT upgrade build_runner
  # without also replacing hive_generator (or hand-writing the adapters).
  # See CONTRACT.md.
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

  flutter_launcher_icons: ^0.14.4

  # Test-only fakes for the video player platform interface: the player
  # error-state test installs a throwing platform (see
  # test/player_details_v104_test.dart). Direct dev deps so the
  # depend_on_referenced_packages lint stays happy.
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - assets/artwork/
    - assets/images/
    # Bundled sample repo JSON ("Load example" in AddRepoScreen).
    # Generated from lib/data/sample_provider.dart — see
    # tool/generate_sample_repo.dart.
    - assets/sample-repo.json

  fonts:
    # Inter variable font (google/fonts). Registered once per weight —
    # Flutter picks the matching instance from the wght axis.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    # Hind Siliguri — Bangla fallback (Inter has no Bengali glyphs).
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#09090D"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
